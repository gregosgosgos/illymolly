# =============================================================================
# GitHub Pages 배포
# -----------------------------------------------------------------------------
# 빌드 단계가 없는 정적 사이트라 저장소를 그대로 올린다.
# configure-pages 의 enablement 가 Pages 가 꺼져 있으면 켜 준다.
#
# 전제: 저장소 Settings > Pages 의 Source 가 "GitHub Actions" 로 한 번 지정되어
# 있어야 한다. 워크플로의 기본 토큰으로는 Pages 사이트를 "처음 만드는" 것이
# 안 되기 때문이다 (Create Pages site -> Resource not accessible by integration).
# 한 번 켜 두면 그 뒤로는 이 워크플로가 알아서 배포한다.
# =============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/adobe-illustrator-webpage-zvh8jk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것은 끝내고 최신 것으로 간다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 테스트·개발용 파일은 사이트에 필요 없다
      - name: 배포할 것만 남기기
        run: rm -rf test node_modules .github

      # 서비스 워커 캐시 버전을 커밋마다 새로 준다. 버전이 그대로면 이미
      # 방문한 사람의 브라우저가 옛 파일을 계속 내주므로 고친 것이 늦게 간다.
      - name: 서비스 워커 캐시 버전 찍기
        run: |
          sed -i "s/illymolly-dev/illymolly-${GITHUB_SHA::12}/" sw.js
          grep -n "var VERSION" sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
