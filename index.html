<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Illymolly — Vector Studio</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="app">

  <!-- ================= MENU BAR ================= -->
  <div id="menubar">
    <div class="brand">Illymolly</div>
    <nav id="menus"></nav>
    <div class="menubar-right">
      <span id="doc-title">무제-1</span>
    </div>
  </div>

  <!-- ================= CONTROL BAR ================= -->
  <div id="controlbar">
    <span id="ctl-toolname" class="ctl-name">선택</span>
    <span class="ctl-sep"></span>

    <span class="ctl-label">칠</span>
    <button class="swatch-btn" id="ctl-fill" title="칠 (Fill)"><i></i></button>
    <span class="ctl-label">획</span>
    <button class="swatch-btn" id="ctl-stroke" title="획 (Stroke)"><i></i></button>
    <input id="ctl-stroke-w" class="ctl-input" list="stroke-widths" value="1" title="획 두께 (pt)" style="width:58px">
    <datalist id="stroke-widths"><option>0.25</option><option>0.5</option><option>0.75</option><option>1</option><option>1.5</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option><option>12</option><option>16</option><option>24</option></datalist>

    <span class="ctl-sep"></span>
    <span class="ctl-label">불투명도</span>
    <input id="ctl-opacity" class="ctl-input" type="number" min="0" max="100" step="1" value="100" style="width:50px">
    <span class="ctl-label">%</span>

    <span class="ctl-sep"></span>
    <span class="ctl-group" id="ctl-xywh">
      <span class="ctl-label">X</span><input class="ctl-input num" id="ctl-x" type="text" value="0">
      <span class="ctl-label">Y</span><input class="ctl-input num" id="ctl-y" type="text" value="0">
      <span class="ctl-gap"></span>
      <span class="ctl-label">W</span><input class="ctl-input num" id="ctl-w" type="text" value="0">
      <button class="mini-btn" id="ctl-lockratio" title="가로세로 비율 유지"></button>
      <span class="ctl-label">H</span><input class="ctl-input num" id="ctl-h" type="text" value="0">
      <span class="ctl-gap"></span>
      <span class="ctl-label" title="회전 각도">∠</span><input class="ctl-input num" id="ctl-a" type="text" value="0">
    </span>

    <span class="ctl-spacer"></span>
    <span id="ctl-tool-options" class="ctl-group"></span>
  </div>

  <!-- ================= MAIN ================= -->
  <div id="main">

    <!-- Toolbar -->
    <div id="toolbar"></div>

    <!-- Stage: 문서 탭 + 작업 영역 -->
    <div id="stage">

    <!-- 문서 탭 (일러스트레이터의 문서 탭) -->
    <div id="doctabs"></div>

    <!-- Workspace -->
    <div id="workspace">
      <div id="ruler-corner"></div>
      <canvas id="ruler-h"></canvas>
      <canvas id="ruler-v"></canvas>
      <div id="canvas-wrap">
        <canvas id="view" tabindex="0"></canvas>
        <textarea id="text-editor" spellcheck="false"></textarea>
        <div id="canvas-hud"></div>
        <div id="iso-bar" hidden><span class="iso-back" title="한 단계 나가기 (Esc)">‹</span><span class="iso-crumbs"></span></div>
      </div>
    </div>

    </div>

    <!-- Panels — 일러스트레이터처럼 탭으로 묶인 도크 -->
    <div id="panels">
      <div class="pgroup" data-group="0">
        <div class="pgroup-tabs">
          <button class="ptab on" data-tab="properties">속성</button>
          <button class="ptab" data-tab="transform">변형</button>
          <b class="fold" title="패널 그룹 접기/펴기"></b>
        </div>
        <section class="panel" data-panel="properties">
          <div class="body" id="p-properties"></div>
        </section>
        <section class="panel tab-hidden" data-panel="transform">
          <div class="body" id="p-transform"></div>
        </section>
      </div>
      <div class="pgroup" data-group="1">
        <div class="pgroup-tabs">
          <button class="ptab on" data-tab="color">색상</button>
          <button class="ptab" data-tab="gradient">그레이디언트</button>
          <button class="ptab" data-tab="swatches">견본</button>
          <b class="fold" title="패널 그룹 접기/펴기"></b>
        </div>
        <section class="panel" data-panel="color">
          <div class="body" id="p-color"></div>
        </section>
        <section class="panel tab-hidden" data-panel="gradient">
          <div class="body" id="p-gradient"></div>
        </section>
        <section class="panel tab-hidden" data-panel="swatches">
          <div class="body" id="p-swatches"></div>
        </section>
      </div>
      <div class="pgroup" data-group="2">
        <div class="pgroup-tabs">
          <button class="ptab on" data-tab="stroke">획</button>
          <button class="ptab" data-tab="type">문자</button>
          <b class="fold" title="패널 그룹 접기/펴기"></b>
        </div>
        <section class="panel" data-panel="stroke">
          <div class="body" id="p-stroke"></div>
        </section>
        <section class="panel tab-hidden" data-panel="type">
          <div class="body" id="p-type"></div>
        </section>
      </div>
      <div class="pgroup" data-group="3">
        <div class="pgroup-tabs">
          <button class="ptab on" data-tab="align">정렬</button>
          <button class="ptab" data-tab="pathfinder">패스파인더</button>
          <b class="fold" title="패널 그룹 접기/펴기"></b>
        </div>
        <section class="panel" data-panel="align">
          <div class="body" id="p-align"></div>
        </section>
        <section class="panel tab-hidden" data-panel="pathfinder">
          <div class="body" id="p-pathfinder"></div>
        </section>
      </div>
      <div class="pgroup" data-group="4">
        <div class="pgroup-tabs">
          <button class="ptab on" data-tab="appearance">모양</button>
          <button class="ptab" data-tab="effects">효과</button>
          <button class="ptab" data-tab="symbols">심볼 · 패턴</button>
          <b class="fold" title="패널 그룹 접기/펴기"></b>
        </div>
        <section class="panel" data-panel="appearance">
          <div class="body" id="p-appearance"></div>
        </section>
        <section class="panel tab-hidden" data-panel="effects">
          <div class="body" id="p-effects"></div>
        </section>
        <section class="panel tab-hidden" data-panel="symbols">
          <div class="body" id="p-symbols"></div>
        </section>
      </div>
      <div class="pgroup" data-group="5">
        <div class="pgroup-tabs">
          <button class="ptab on" data-tab="layers">레이어</button>
          <button class="ptab" data-tab="artboards">대지</button>
          <b class="fold" title="패널 그룹 접기/펴기"></b>
        </div>
        <section class="panel" data-panel="layers">
          <div class="body" id="p-layers"></div>
        </section>
        <section class="panel tab-hidden" data-panel="artboards">
          <div class="body" id="p-artboards"></div>
        </section>
      </div>
    </div>
    </div>
  </div>

  <!-- ================= STATUS BAR ================= -->
  <div id="statusbar">
    <div class="zoombox">
      <input id="st-zoom" value="100%">
      <span class="pct">%</span>
    </div>
    <span class="ctl-sep"></span>
    <span class="ab-nav">
      <button class="ab-btn" id="ab-first" title="첫 대지"></button>
      <button class="ab-btn" id="ab-prev" title="이전 대지 (Alt+PageUp)"></button>
      <span id="st-artboard">대지 1</span>
      <button class="ab-btn" id="ab-next" title="다음 대지 (Alt+PageDown)"></button>
      <button class="ab-btn" id="ab-last" title="마지막 대지"></button>
    </span>
    <span class="ctl-sep"></span>
    <span id="st-hint">선택 도구</span>
    <span class="ctl-spacer"></span>
    <span id="st-coords">0 , 0</span>
  </div>
</div>

<div id="contextmenu" class="menu-pop" hidden></div>
<div id="colorpop" class="pop" hidden></div>
<div id="toast" hidden></div>

<script src="src/util.js"></script>
<script src="src/color.js"></script>
<script src="src/model.js"></script>
<script src="src/geom.js"></script>
<script src="src/pathfinder.js"></script>
<script src="src/history.js"></script>
<script src="src/appearance.js"></script>
<script src="src/assets.js"></script>
<script src="src/distort.js"></script>
<script src="src/effects.js"></script>
<script src="src/render.js"></script>
<script src="src/hit.js"></script>
<script src="src/cursors.js"></script>
<script src="src/view.js"></script>
<script src="src/edit.js"></script>
<script src="src/docs.js"></script>
<script src="src/tools/base.js"></script>
<script src="src/tools/select.js"></script>
<script src="src/tools/directselect.js"></script>
<script src="src/tools/pen.js"></script>
<script src="src/tools/shape.js"></script>
<script src="src/tools/type.js"></script>
<script src="src/tools/freehand.js"></script>
<script src="src/tools/transformtools.js"></script>
<script src="src/tools/shapebuilder.js"></script>
<script src="src/tools/width.js"></script>
<script src="src/tools/misc.js"></script>
<script src="src/tools/index.js"></script>
<script src="src/commands.js"></script>
<script src="src/keymap.js"></script>
<script src="src/ui/dialog.js"></script>
<script src="src/ui/dialogs.js"></script>
<script src="src/ui/menus.js"></script>
<script src="src/ui/icons.js"></script>
<script src="src/ui/panels.js"></script>
<script src="src/ui/layers.js"></script>
<script src="src/ui/colorui.js"></script>
<script src="src/trace.js"></script>
<script src="src/pdf.js"></script>
<script src="src/io.js"></script>
<script src="src/api.js"></script>
<script src="src/bridge.js"></script>
<script src="src/mobile.js"></script>
<script src="src/app.js"></script>
</body>
</html>
