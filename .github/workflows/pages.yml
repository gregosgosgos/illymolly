# =============================================================================
# GitHub Pages 배포
# -----------------------------------------------------------------------------
# 빌드 단계가 없는 정적 사이트라 저장소를 그대로 올린다.
# configure-pages 의 enablement 가 Pages 가 꺼져 있으면 켜 준다.
#
# 이 워크플로가 돌려면 저장소 쪽에서 두 가지가 갖춰져야 한다.
#   1. Actions 가 실행될 수 있어야 한다 (비공개 저장소는 Actions 분을 쓴다 —
#      지출 한도가 0 이거나 분이 떨어지면 러너가 배정되지 않고 즉시 실패한다)
#   2. Pages 를 쓸 수 있어야 한다 (무료 요금제는 공개 저장소만 가능)
# =============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/adobe-illustrator-webpage-zvh8jk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것은 끝내고 최신 것으로 간다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages 설정 (꺼져 있으면 켠다)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 테스트·개발용 파일은 사이트에 필요 없다
      - name: 배포할 것만 남기기
        run: rm -rf test node_modules .github

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
