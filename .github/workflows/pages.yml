name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/adobe-illustrator-webpage-zvh8jk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages 를 쓸 수 있는 저장소인지 먼저 확인한다 (요금제 · 공개 여부에 걸린다)
      - name: Pages 사용 가능 여부
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- 현재 Pages 상태 ---"
          gh api "repos/${{ github.repository }}/pages" && echo "이미 켜져 있음" || echo "(아직 꺼져 있음)"
          echo "--- 켜기 시도 ---"
          gh api -X POST "repos/${{ github.repository }}/pages" \
            -f "build_type=workflow" 2>&1 | tee /tmp/enable.txt || true
          cat /tmp/enable.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
